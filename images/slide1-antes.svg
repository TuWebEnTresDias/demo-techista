<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f1f5f9"/>
  <!-- sky -->
  <rect width="800" height="200" fill="#cbd5e1"/>
  <!-- house body -->
  <rect x="120" y="220" width="560" height="260" fill="#e2e8f0"/>
  <!-- damaged roof -->
  <polygon points="80,230 400,70 720,230" fill="#9ca3af"/>
  <polygon points="80,230 400,70 720,230" fill="none" stroke="#6b7280" stroke-width="6"/>
  <!-- missing/broken tiles -->
  <g fill="#f87171" opacity="0.8">
    <polygon points="300,160 340,180 320,200 280,180"/>
    <polygon points="430,140 470,160 450,180 410,160"/>
  </g>
  <!-- cracks -->
  <g stroke="#4b5563" stroke-width="4" fill="none" opacity="0.7">
    <path d="M360 150 l20 30 l-15 25 l25 20"/>
    <path d="M520 175 l-18 28 l22 22"/>
  </g>
  <!-- water stains -->
  <path d="M250 235 q20 120 0 250" stroke="#93c5fd" stroke-width="22" fill="none" opacity="0.55"/>
  <path d="M560 235 q-15 130 8 250" stroke="#93c5fd" stroke-width="16" fill="none" opacity="0.45"/>
  <!-- drips -->
  <g fill="#3b82f6">
    <path d="M250 300 q-10 18 0 30 q10 -12 0 -30"/>
    <path d="M250 380 q-10 18 0 30 q10 -12 0 -30"/>
    <path d="M560 360 q-10 18 0 30 q10 -12 0 -30"/>
  </g>
  <!-- puddle -->
  <ellipse cx="250" cy="478" rx="70" ry="12" fill="#60a5fa" opacity="0.5"/>
  <!-- warning -->
  <circle cx="400" cy="400" r="34" fill="#ef4444"/>
  <text x="400" y="412" font-family="Arial" font-size="40" fill="#fff" text-anchor="middle" font-weight="bold">!</text>
</svg>
