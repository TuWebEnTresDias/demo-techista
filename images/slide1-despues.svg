<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f8fafc"/>
  <!-- sky -->
  <rect width="800" height="200" fill="#bae6fd"/>
  <!-- sun -->
  <circle cx="690" cy="70" r="36" fill="#fde047"/>
  <!-- house body -->
  <rect x="120" y="220" width="560" height="260" fill="#fde68a"/>
  <!-- repaired roof -->
  <polygon points="80,230 400,70 720,230" fill="url(#rg)" />
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <polygon points="80,230 400,70 720,230" fill="none" stroke="#7c2d12" stroke-width="6"/>
  <!-- neat tile lines -->
  <g stroke="#7c2d12" stroke-width="3" opacity="0.4">
    <line x1="180" y1="190" x2="620" y2="190"/>
    <line x1="140" y1="210" x2="660" y2="210"/>
    <line x1="100" y1="228" x2="700" y2="228"/>
  </g>
  <!-- chimney -->
  <rect x="560" y="120" width="40" height="80" fill="#9a3412"/>
  <!-- door and windows -->
  <rect x="370" y="330" width="70" height="150" rx="6" fill="#b45309"/>
  <rect x="180" y="300" width="80" height="80" rx="6" fill="#bfdbfe" stroke="#9a3412" stroke-width="5"/>
  <rect x="540" y="300" width="80" height="80" rx="6" fill="#bfdbfe" stroke="#9a3412" stroke-width="5"/>
  <!-- clean, no leaks -->
  <circle cx="400" cy="430" r="30" fill="#22c55e"/>
  <path d="M384 430 l11 12 l20 -24" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="490" font-family="Arial" font-size="22" fill="#15803d" text-anchor="middle" font-weight="bold">Techo sellado y sin filtraciones</text>
</svg>
